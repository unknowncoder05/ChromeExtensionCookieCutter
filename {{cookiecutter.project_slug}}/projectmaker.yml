version: "1"

commands:
  validate:
    label: "Validate Extension"
    description: "Check Manifest V3 structure and required extension files."
    run: "npm install && npm run validate"
    service: extension
  build:
    label: "Build Extension Package"
    description: "Validate and copy the Chrome extension into dist/ for loading or packaging."
    run: "npm install && npm run build"
    service: extension

smoke_test:
  steps:
    - label: "Validate extension"
      run: "npm run validate"
      service: extension
    - label: "Build extension"
      run: "npm run build"
      service: extension

services:
  extension:
    type: frontend
    cpu: 0.25
    memory: 256
    build:
      context: .
      dockerfile: Dockerfile
    env:
      EXTENSION_NAME:
        type: string
        label: "Extension Name"
        description: "Display name used in Chrome extension surfaces."
        placeholder: "My Chrome Extension"
        section: Identity
        required: true
        default: "{{ cookiecutter.extension_name }}"
      EXTENSION_DESCRIPTION:
        type: text
        label: "Extension Description"
        description: "Short public description of what the extension does."
        placeholder: "A browser extension that improves a daily workflow."
        section: Identity
        required: true
        default: "{{ cookiecutter.extension_description }}"
      HOMEPAGE_URL:
        type: url
        label: "Homepage URL"
        description: "Public project or support URL used by the extension manifest."
        placeholder: "https://example.com"
        section: Identity
        required: false
        default: "{{ cookiecutter.homepage_url }}"
